<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><style>
html,body {margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden}
canvas {display:block;width:1920px;height:1080px}
</style></head><body><canvas width="1920" height="1080"></canvas>
<script type="module">
import {drawLyrics} from "./core.js";
import {ensureFont} from "./fonts.js";
const canvas=document.querySelector("canvas"),ctx=canvas.getContext("2d");
await ensureFont("noto-sans");
window.prepareFrame=project=>ensureFont(project.style.fontId);
window.drawFrame=(project,time)=>drawLyrics(ctx,project,time);
window.renderReady=true;
</script></body></html>
